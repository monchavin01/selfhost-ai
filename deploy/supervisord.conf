; Paths come from the environment exported by scripts/bootstrap.sh (W, REPO, VENVS, BIN, LOG_DIR, TS_STATE, ...).
[unix_http_server]
file=%(ENV_W)s/supervisor.sock
chmod=0700

[supervisord]
logfile=%(ENV_LOG_DIR)s/supervisord.log
pidfile=%(ENV_W)s/supervisord.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_W)s/supervisor.sock

; tailscaled and gpu-logger autostart; backend, litellm and vllm are started by bootstrap.sh once models and voices exist.
[program:tailscaled]
command=%(ENV_BIN)s/tailscaled --tun=userspace-networking --state=%(ENV_TS_STATE)s/tailscaled.state --socket=%(ENV_TS_STATE)s/tailscaled.sock
autorestart=true
startretries=10
redirect_stderr=true
stdout_logfile=%(ENV_LOG_DIR)s/tailscaled.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:backend]
command=%(ENV_VENVS)s/backend/bin/python -m uvicorn backend.app:app --host 127.0.0.1 --port 8001
directory=%(ENV_REPO)s
environment=LD_LIBRARY_PATH="%(ENV_BACKEND_LD_LIBRARY_PATH)s"
autostart=false
autorestart=true
startretries=10
redirect_stderr=true
stdout_logfile=%(ENV_LOG_DIR)s/backend.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

; 0.0.0.0 so Vast's own port mapping would work if ever added (Vast publishes nothing unless mapped).
; With Tailscale userspace networking, tailnet traffic to this node is proxied to localhost, so 127.0.0.1 may suffice.
[program:litellm]
command=%(ENV_VENVS)s/litellm/bin/litellm --config %(ENV_REPO)s/litellm.yaml --host 0.0.0.0 --port 4000
directory=%(ENV_REPO)s
autostart=false
autorestart=true
startretries=10
redirect_stderr=true
stdout_logfile=%(ENV_LOG_DIR)s/litellm.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

; 24 GB card: backend ~10 GB after load, so vLLM gets HUNYUAN_GPU_UTIL x 24 GB (default 0.45 = ~10.8 GB:
; fp8 7B weights ~8 GB + ~2 GB KV cache). Backend must load first.
[program:vllm]
command=%(ENV_VENVS)s/vllm/bin/vllm serve %(ENV_HUNYUAN_REPO)s --revision %(ENV_HUNYUAN_REVISION)s --served-model-name hunyuan-mt-7b --host 127.0.0.1 --port 8002 --gpu-memory-utilization %(ENV_HUNYUAN_GPU_UTIL)s --max-model-len 4096 --max-num-seqs 4
environment=HF_HUB_OFFLINE="1"
autostart=false
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(ENV_LOG_DIR)s/vllm.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[program:gpu-logger]
command=bash -c 'while true; do echo "$(date -u +%%FT%%TZ) $(nvidia-smi --query-gpu=utilization.gpu,memory.used,memory.total,temperature.gpu --format=csv,noheader 2>&1)"; sleep 5; done >>%(ENV_LOG_DIR)s/gpu.log'
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(ENV_LOG_DIR)s/gpu-logger.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
